version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rudrashield-backend
    restart: always
    environment:
      DATABASE_URL: sqlite:////app/data/rudrashield.db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 characters}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      DEMO_MODE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rudrashield-frontend
    restart: always
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
